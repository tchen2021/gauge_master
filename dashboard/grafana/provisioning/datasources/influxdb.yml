apiVersion: 1
datasources:
  - name: InfluxDB
    type: influxdb
    uid: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: gauge-lab
      defaultBucket: gauges
    secureJsonData:
      token: gauge-dev-token-change-me
